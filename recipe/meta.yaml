{% set name = "dandi" %}
{% set version = "0.78.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: dc6534ce24af32d4654e0d7d526fe1adc9062abd228cf95b7d9ea7defe2e1a0b
  patches:
    # bids-validator-deno is not yet available on conda-forge;
    # make it a soft dependency until a feedstock is created
    - 0001-Gracefully-handle-missing-bids-validator-deno.patch

build:
  number: 0
  skip: true  # [py<311]
  entry_points:
    - dandi=dandi.cli.command:main
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - python                              # [build_platform != target_platform]
    - cross-python_{{ target_platform }}  # [build_platform != target_platform]
  host:
    - python
    - pip
    - setuptools >=38.3.0
  run:
    - python
    - bidsschematools >=1.0,<2.0
    # bids-validator-deno >=2.0.5 -- not yet on conda-forge; patched to be optional
    - click >=8.2
    - click-didyoumean >=0.3.1
    # 0.13.0 lacks the downgrade migrations the client uses to talk to older
    # Archive servers; 0.14.0 restored them
    - dandischema >=0.12.0,!=0.13.0,<0.15.0
    - etelemetry >=0.2.2
    - fasteners >=0.19
    - fscacher >=0.3.0
    - hdmf >=4.1.0
    - humanize >=4.5.0
    - interleave >=0.3,<1.0
    - joblib >=1.3.0
    - keyring >=23.10.0
    - keyrings.alt >=5.0.0
    - numcodecs >=0.11.0
    - nwbinspector >=0.7.0
    - packaging >=22.0
    - platformdirs >=4.1.0
    - pycryptodomex >=3.16.0
    - pydantic >=2.9,<3.0
    - pynwb >=3.1.0
    - pyout >=0.7.3
    - python-dateutil >=2.9.0
    - requests >=2.30,<3.0
    - ruamel.yaml >=0.16.0,<1
    - semantic_version >=2.10.0
    - tenacity >=8.2.0
    # 0.1.62 is the first release built for numpy 2.x
    - tensorstore >=0.1.62  # [not win]
    - urllib3 >=2.0.2
    - yarl >=1.9.1,<2.0
    - zarr >=2.18.0,<=3.1.5
    - zarr-checksum >=0.4.0,<0.5

test:
  requires:
    - anys >=0.3,<1.0
    - bash >=4.5  # [not win]
    - git
    - opencv
    - libopencv *=headless*  # [linux]
    - pytest
    - pytest-mock
    - pytest-rerunfailures
    - pytest-timeout
    - responses !=0.24.0,!=0.25.5
    - vcrpy >=5.0.0
  imports:
    - dandi
  commands:
    - dandi --help

about:
  home: https://github.com/dandi/dandi-cli
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Command line client for interaction with DANDI Archive elements
  dev_url: https://github.com/dandi/dandi-cli

extra:
  recipe-maintainers:
    - yarikoptic
